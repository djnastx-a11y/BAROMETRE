<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0c"><title>Le Baromètre</title><style>html,body{margin:0;background:#09090a;color:#f7f4ed;font-family:system-ui;min-height:100%}body{display:grid;place-items:center;min-height:100vh}#status{font-size:14px;opacity:.8}</style></head><body><div id="status">Chargement du Baromètre…</div><script>(async()=>{try{let html='';for(let i=0;i<4;i++){const n=String(i).padStart(3,'0');const r=await fetch('payload/part-'+n+'?v=8',{cache:'no-store'});if(!r.ok)throw new Error('part-'+n);html+=await r.text()}html=html.replace('</head>','<style id="auth-cloak">html{visibility:hidden}</style></head>').replace('</body>','<script src="private-auth.js?v=1"><\/script></body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Chargement impossible. Réessaie dans un instant.';console.error(e)}})();</script></body></html>
