<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Baromètre</title></head><body style="margin:0;background:#09090a;color:#f7f4ed;font-family:system-ui;display:grid;place-items:center;min-height:100vh"><div id="status">Chargement du Baromètre…</div><script>(async()=>{try{const parts=[];for(let i=0;i<10;i++){const n=String(i).padStart(3,'0');const r=await fetch('.payload/part-'+n+'?v=8',{cache:'no-store'});if(!r.ok)throw new Error('part-'+n);parts.push((await r.text()).trim())}const b64=parts.join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const html=new TextDecoder('utf-8').decode(bytes);document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Chargement impossible. Réessaie dans un instant.'}})();</script></body></html>
